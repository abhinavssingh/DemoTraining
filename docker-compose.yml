services:
  sql:
    build:
      context: .
      dockerfile: ./docker/sql.Dockerfile
    container_name: demotraining-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Developer"
      DATABASE_NAME: ${DATABASE_NAME}
    ports:
      # Publish only if you want to connect from host tools
      - "1500:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    # Basic healthcheck: TCP availability
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1433 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
  web:
    build:
      context: .
      dockerfile: ./docker/web.Dockerfile
    container_name: demotraining-web
    ports:
      - "${SITE_PORT}:80"
    environment:
      # Optimizely/EPiServer default connection string name (often EPiServerDB)
      ConnectionStrings__EPiServerDB: "Server=sql,1433;Database=${DATABASE_NAME};User ID=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"
      Find__ServiceUrl: ${Find_ServiceUrl}   # use your region's endpoint
      Find__DefaultIndex: ${Find_DefaultIndex}
      ASPNETCORE_URLS: "http://+:80"
    depends_on:
      sql:
        condition: service_healthy

volumes:
  mssqldata: