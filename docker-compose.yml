services:
  sql:
    build:
      context: .
      dockerfile: ./docker/sql.Dockerfile
    container_name: demotraining-sql
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: "Developer"
      DATABASE_NAME: ${DATABASE_NAME}
    ports:
      # Publish only if you want to connect from host tools
      - "1500:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    # Basic healthcheck: TCP availability
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1433 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 30
  web:
    build:
      context: .
      dockerfile: ./docker/web.Dockerfile
    container_name: demotraining-web    
    volumes:
      - ./App_Data/ToImport:/app/App_Data/ToImport
      - ./App_Data/Imported:/app/App_Data/Imported
      - ./App_Data/blobs:/app/App_Data/blobs
      - ./dpkeys:/app/dpkeys
    environment:
      # Optimizely/EPiServer default connection string name (often EPiServerDB)
      ConnectionStrings__EPiServerDB: "Data Source=demotraining-sql;Database=${DATABASE_NAME};User Id=sa;Password=${SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      EPiServer__Find__ServiceUrl: "${EPiServer_Find_ServiceUrl}"   # use your region's endpoint
      EPiServer__Find__DefaultIndex: "${EPiServer_Find_DefaultIndex}"
      EPiServer__MediaImport__ImportAssetsFolder: "${EPiServer_MediaImport_ImportAssetsFolder}"
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: http://*:${SITE_PORT}
    ports:
      - "${SITE_PORT}:${SITE_PORT}"
    depends_on:
      sql:
        condition: service_healthy

volumes:
  mssqldata: