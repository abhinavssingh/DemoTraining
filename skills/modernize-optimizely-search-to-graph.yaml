name: modernize-optimizely-search-to-graph
displayName: Migrate Optimizely Search & Navigation to Optimizely Graph
description: >
  Migrates Optimizely Search & Navigation (EPiServer.Find)
  usage to Optimizely Graph for CMS 13, replacing legacy
  Find APIs with the official Optimizely Graph C# SDK,
  enforcing explicit Graph service registration and
  canonical configuration, query rewrites, and UI wiring.

appliesTo:
  languages: [csharp]
  frameworks: [aspnetcore]
  cms: optimizely

sourceGuidance:
  - https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13

guardrails:
  - Do not upgrade CMS packages (handled by CMS upgrade skill)
  - Search must be migrated, not disabled or commented out
  - Preserve query intent, ordering, paging, and filtering
  - All Graph queries must be asynchronous
  - Do not invent undocumented configuration keys
  - Do not hide Graph registrations behind extension methods
  - Do not create custom Graph abstraction services

tasks:

# =========================================================
# Phase A — Search Usage Analysis (READ‑ONLY)
# =========================================================
- id: analyze-search
  description: Locate Optimizely Search & Navigation (EPiServer.Find) usage.
  breakingChange:
    summary: >
      Optimizely Search & Navigation (EPiServer.Find) is deprecated and
      removed in CMS 13. All Find-based search usage must be identified
      and migrated to Optimizely Graph.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Migration overview
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#migration-overview

  enforcement:
    detectionPatterns:
      - EPiServer.Find
      - EPiServer.Find.Cms
      - EPiServer.Find.Framework
      - IClient
      - Search<
      - UnifiedSearch
      - FindOptions
      - FilterForVisitor
      - GetContentResult

    requiredActions:
      - Enumerate every Find-based search query and document:
          Query purpose
          Filters applied
          Paging and sorting behavior
          Expected result types
      - Classify search usage as:
          Full-text search
          Structured filtering
          UnifiedSearch
      - Mark Phase B–F tasks as REQUIRED if any Find usage is detected

    failureConditions:
      - EPiServer.Find usage is detected but no migration tasks are executed
      - Search migration is skipped while Find usage still exists

# =========================================================
# Phase B — Package Replacement
# =========================================================
- id: replace-search-packages
  description: Replace EPiServer.Find packages with Optimizely Graph packages
  breakingChange:
    summary: Search & Navigation packages are removed and replaced by Optimizely Graph.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Replace Find NuGet packages
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#replace-find-nuget-packages
  instructions: >
    Remove packages:
      - EPiServer.Find
      - EPiServer.Find.Cms
      - EPiServer.Find.Framework
      - Wangkanai.Detection (if present)

    Add:
      - Optimizely.Graph.Client 1.5.0
      - Optimizely.Graph.Cms 13.0.2
      - Optimizely.Graph.Cms.Query 13.0.2
      - Optimizely.Graph.AspNetCore 13.0.2
      - EPiServer.Cms.UI.ContentManager 13.0.2 (if not already present)

    Restore packages; expect compile errors until query migration completes.

# =========================================================
# Phase C — REQUIRED Graph Service Registration
# (HARD ENFORCEMENT — NO CUSTOM GRAPH SERVICES)
# =========================================================
- id: replace-search-packagesely Search & Navigation (EPiServer.Find) packages are removed
      in CMS 13 and must be fully replaced with Optimizely Graph packages.
  description: Replace EPiServer.Find packages with Optimizely Graph packages.
  breakingChange:
    summary: >
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Replace Find NuGet packages
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#replace-find-nuget-packages

  enforcement:
    forbiddenPackages:
      - EPiServer.Find
      - EPiServer.Find.Cms
      - EPiServer.Find.Framework
      - EPiServer.Find.Framework.Statistics
      - EPiServer.Find.Helpers
      - Wangkanai.Detection

    requiredPackages:
      - Optimizely.Graph.Client
      - Optimizely.Graph.Cms
      - Optimizely.Graph.Cms.Query
      - Optimizely.Graph.AspNetCore
      - EPiServer.Cms.UI.ContentManager

    requiredActions:
      - Remove all EPiServer.Find-related PackageReference entries
      - Remove Wangkanai.Detection if present (Find transitive dependency)
      - Add required Optimizely Graph packages with CMS 13–compatible versions
      - Run dotnet restore using PowerShell
      - Allow expected compile failures until search code migration completes

    validationChecks:
      - dotnet list package must not contain any EPiServer.Find packages
      - No transitive dependency pulls in EPiServer.Find
      - Graph packages resolve successfully under net10.0

    failureConditions:
      - Any EPiServer.Find package remains directly or transitively referenced
      - Required Graph packages are missing
      - dotnet restore succeeds while Find packages are still present


# =========================================================
# Phase D — Graph Configuration
# =========================================================
- id: configure-graph
  description: Replace legacy Search & Navigation configuration with canonical Optimizely Graph configuration.
  breakingChange:
    summary: >
      CMS 13 removes EPiServer:Find configuration. Search functionality
      must be configured using the Optimizely:Graph configuration section
      with a strict, documented schema.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Update configuration
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#update-configuration

  enforcement:
    forbiddenConfigurationKeys:
      - EPiServer:Find
      - EPiServer.Find
      - Find:ServiceUrl
      - Find:DefaultIndex

    requiredConfiguration:
      Optimizely:
        Graph:
          GatewayAddress: https://cg.optimizely.com
          AppKey: "<string>"
          Secret: "<string>"
          SingleKey: "<string>"

    requiredActions:
      - Remove the entire EPiServer:Find configuration section from all appsettings files
      - Add the Optimizely:Graph section with EXACT key names and structure
      - Ensure configuration exists in all active environments:
          appsettings.json
          appsettings.Development.json
          appsettings.Production.json (or equivalent)
      - Do not hardcode secrets; use placeholders or environment variables
      - Do not add undocumented configuration keys under Optimizely:Graph
      - Remove all TODO comments related to CMS13 Graph configuration

    validationChecks:
      - Configuration binding for Optimizely.Graph succeeds at startup
      - Graph services resolve credentials from configuration without errors

    failureConditions:
      - Any EPiServer:Find configuration remains
      - Optimizely:Graph section is missing or malformed
      - Undocumented keys are present under Optimizely:Graph

# =========================================================
# Phase E — Namespace & Client Migration
# =========================================================
- id: migrate-namespaces
  description: >
    Replace all Optimizely Search & Navigation (Find) namespaces and
    client abstractions with Optimizely Graph equivalents and
    enforce full removal of legacy APIs.
  breakingChange:
    summary: >
      IClient and EPiServer.Find namespaces are not supported in CMS 13
      and must be replaced with IGraphContentClient and
      Optimizely.Graph.Cms.Query.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Replace namespaces and client usage
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#replace-namespaces

  enforcement:
    rules:
      - Replace namespace usages:
          from:
            - EPiServer.Find
            - EPiServer.Find.Api
            - EPiServer.Find.Cms
            - EPiServer.Find.Framework
          to: Optimizely.Graph.Cms.Query

      - Replace client abstractions:
          from: EPiServer.Find.IClient
          to: Optimizely.Graph.Cms.Query.IGraphContentClient

      - Remove unsupported Find helper/UI namespaces:
          remove:
            - EPiServer.Find.Helpers.*
            - EPiServer.Find.UI
            - EPiServer.Find.Framework.Statistics

      - Update constructor injection:
          from: IClient
          to: IGraphContentClient

  failIf:
    - Any EPiServer.Find namespace remains in runtime code
    - Any usage of IClient remains

# =========================================================
# Phase F — Validate No Find Namespaces or IClient Usage
# =========================================================
- id: validate-no-find-namespaces-or-iclient- id
  description: Validate complete removal of Find namespaces and IClient usage
  breakingChange:
    summary: >
      cause runtime or startup failures in CMS 13.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Replace namespaces and client usage
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#replace-namespaces

  validation:
    mustNotContain:
      - EPiServer.Find
      - EPiServer.Find.Api
      - EPiServer.Find.Cms
      - EPiServer.Find.Framework
      - EPiServer.Find.Helpers
      - EPiServer.Find.UI
      - IClient

  onFailure:
    action: stop
    message: >
      Search → Graph migration is incomplete.
      Remove all EPiServer.Find namespaces and IClient usage
      before continuing.


# =========================================================
# Phase G — Query & Code Migration
# =========================================================
- id: migrate-search-code
  description: Rewrite all EPiServer.Find queries using Optimizely Graph QueryContent APIs.
  breakingChange:
    summary: >
      Optimizely Search & Navigation (EPiServer.Find) query APIs are removed
      in CMS 13. All search logic must be rewritten using the asynchronous
      Optimizely Graph C# SDK QueryContent APIs.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Rewrite search queries
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#rewrite-search-queries

  enforcement:
    forbiddenPatterns:
      - IClient
      - UnifiedSearch
      - Search<
      - .For(
      - .Filter(
      - FilterForVisitor
      - GetContentResult(
      - FindOptions
      - EPiServer.Find

    requiredActions:
      - Replace all Find-based queries with Graph SDK queries using:
          IGraphContentClient.QueryContent<T>()
          .SearchFor()
          .Where()
          .WithDisplayFilters()
          .Limit()
          .Skip()
          .IncludeTotal()
          await .GetAsContentAsync()
      - Ensure all Graph queries:
          Use async/await
          Return Task-typed results
          Preserve paging, sorting, and relevance behavior
      - Replace synchronous Find usage with fully async Graph queries
      - Remove all CMS13 migration comments from code
      - Remove all transitional TODOs related to search migration
      - Ensure code reflects final Graph SDK usage only


    examples:
      before: |
        var result = _client.Search<StandardPage>()
            .For(query)
            .FilterForVisitor()
            .Take(10)
            .GetContentResult();

      after: |
        var result = await _graphClient
            .QueryContent<StandardPage>()
            .SearchFor(query)
            .WithDisplayFilters()
            .Limit(10)
            .IncludeTotal()
            .GetAsContentAsync();

    validationChecks:
      - Controllers and services inject IGraphContentClient directly
      - No synchronous search APIs remain
      - Search results and total counts are returned correctly

    failureConditions:
      - Any EPiServer.Find API usage remains
      - Any STAGE / TODO CMS13 migration comment remains
      - Any file claims migration without full Graph implementation



# =========================================================
# Phase H — Razor Views & Tracking
# =========================================================
- id: update-views
  description: >
    Update Razor views to use Optimizely Graph TagHelpers
    and enforce Graph-based tracking and link rendering
    for search result interactions.
  breakingChange:
    summary: >
      Optimizely Graph introduces TagHelpers for search
      tracking and analytics. Legacy Razor markup does
      not support Graph tracking in CMS 13.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Update Razor views
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#update-razor-views

  enforcement:
    rules:

      # -----------------------------------------------------
      # Razor Infrastructure (MANDATORY)
      # -----------------------------------------------------
      - Ensure Graph TagHelpers are available:
          file: _ViewImports.cshtml
          mustContain:
            - "@addTagHelper *, Optimizely.Graph.AspNetCore"

      - Ensure Graph tracking is initialized:
          file: Layout*
          mustContain:
            - "<graph-tracking-setup />"

      # -----------------------------------------------------
      # Search Result Link Migration (MANDATORY)
      # -----------------------------------------------------
      - Replace legacy anchor tags used for search results:
          from:
            - "<a"
          to:
            - "<graph-trackable-link"

      - Ensure graph-trackable-link usage includes:
          - url or content reference binding
          - tracking enabled for click analytics

      # -----------------------------------------------------
      # Prevent Legacy Patterns
      # -----------------------------------------------------
      - Remove or replace:
          - Html.ActionLink
          - Html.RouteLink
          - Url.ContentUrl in search result rendering

  failIf:
    # -------------------------------------------------------
    # Hard Fail Conditions
    # -------------------------------------------------------
    - Any search result view:
        - Lacks Graph TagHelpers import
        - Lacks <graph-tracking-setup />
        - Uses <a> tags instead of <graph-trackable-link>

    - Graph tag helpers are present but unused in search views

# =========================================================
# Phase I — Cleanup & Validation (Operational)
# =========================================================
- id: Search & Navigation artifacts and validate Graph migration integrity.
  breakingChange:
    summary: >
      CMS 13 removes Optimizely Search & Navigation entirely.
      After migration, no Find artifacts, transitional code,
      or incomplete Graph usage may remain.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Remove remaining Search & Navigation code
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#remove-remaining-search-navigation-code

  enforcement:
    forbiddenPatterns:
      # Legacy Find usage
      - EPiServer.Find
      - IClient
      - UnifiedSearch
      - FindOptions
      - GetContentResult
      - FilterForVisitor

      # Transitional / incomplete migration markers
      - STAGE CMS13
      - STAGE 2 CMS13
      - TODO CMS13
      - migrated from EPiServer.Find
      - pending Graph SDK
      - temporary Graph implementation

    requiredActions:
      - Ensure all EPiServer.Find namespaces and APIs are fully removed
      - Ensure all search controllers and services use:
          IGraphContentClient
          QueryContent<T>()
          async/await
          IncludeTotal()
      - Ensure Graph services are registered explicitly and correctly
      - Ensure Optimizely:Graph configuration exists and is valid
      - Remove all CMS13 migration comments related to search
      - Verify search functionality works end-to-end using Graph

    validationChecks:
      - Build succeeds with no references to EPiServer.Find
      - Search queries return results via Graph
      - Total result counts are returned correctly
      - No transitional or staged migration comments remain

    failureConditions:
      - Any EPiServer.Find usage remains in codebase
      - Any CMS13 stage/TODO/migration marker remains
      - Graph services are missing or misconfigured
      - Search code claims migration but does not use final Graph SDK APIs

# =========================================================
# Phase J — Documentation
# =========================================================
- id: generate-cms13-graph-upgrade-summary
  description: >
    Generate mandatory Graph migration audit documentation
    covering all changes required to validate, test, and
    deploy CMS 13 with Optimizely Graph.
  breakingChange:
    summary: >
      Graph migration must be documented to validate that
      CMS 13 search functionality is correctly migrated,
      testable, and production-ready.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Build and test
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#build-and-test

  enforcement:
    requirements:
      outputFile: CMS13-Graph-Upgrade.md

      mustDocument:
        # -----------------------------------------------
        # Package & Dependency Changes
        # -----------------------------------------------
        - Removal of all EPiServer.Find packages
        - Installation of Optimizely.Graph.Cms.Query
        - Installation of Optimizely.Graph.AspNetCore

        # -----------------------------------------------
        # Service Registration
        # -----------------------------------------------
        - Exact Startup.cs service registrations:
            - services.AddContentGraph()
            - services.AddGraphContentClient()
            - services.AddVisitorGroupsCore()
        - Graph middleware usage:
            - app.UseGraphTrackingScripts()

        # -----------------------------------------------
        # Configuration
        # -----------------------------------------------
        - Optimizely:Graph configuration structure
        - Credential placeholders (AppKey, Secret, SingleKey)
        - Configuration source (Portal / Environment variables)

        # -----------------------------------------------
        # Code Migration
        # -----------------------------------------------
        - Namespace migration (EPiServer.Find → Optimizely.Graph)
        - Controller migration to async Graph APIs
        - Query rewrite mappings (Find → Graph)
        - Enforcement of IncludeTotal()

        # -----------------------------------------------
        # View & UI Migration
        # -----------------------------------------------
        - Graph TagHelper registration in _ViewImports.cshtml
        - graph-tracking-setup usage in layouts
        - graph-trackable-link usage in search views

        # -----------------------------------------------
        # Validation & Testing
        # -----------------------------------------------
        - Build verification (dotnet build)
        - Runtime validation steps
        - Known limitations (if SDK pending)
        - Manual validation checklist

  failIf:
    - CMS13-Graph-Upgrade.md does not exist
    - Documentation omits any mandatory section listed above
    - Graph migration occurred but documentation was not generated

  onFailure:
    action: stop
    message: >
      Graph migration documentation is missing or incomplete.
      CMS 13 upgrade cannot be considered complete
      without CMS13-Graph-Upgrade.md.