name: modernize-optimizely-search-to-graph
displayName: Migrate Optimizely Search & Navigation to Optimizely Graph
description: >
  Migrates Optimizely Search & Navigation (EPiServer.Find)
  usage to Optimizely Graph for CMS 13, implementing
  all required Startup registrations, configuration,
  async Graph query patterns, and UI wiring exactly as
  described in the official Alloy migration guide.

sourceGuidance:
  - https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13

guardrails:
  - Do not upgrade CMS packages (handled by CMS upgrade skill)
  - Search must be migrated, not disabled or commented out
  - Preserve query intent, ordering, paging, and filtering
  - All Graph queries must be asynchronous
  - Do not invent undocumented configuration keys
  - Do not hide Graph registrations behind extension methods
  - Add TODOs only for SDK‑dependent logic, not wiring

tasks:

  # =========================================================
  # Phase A — Search Usage Analysis (READ‑ONLY)
  # =========================================================
  - id: analyze-search
    description: Locate legacy Optimizely Search & Navigation usage
    instructions: >
      Scan the solution for EPiServer.Find usage including:
      IClient, Search<T>(), For(), Filter(),
      FilterForVisitor(), Take(), GetContentResult(),
      UnifiedSearch, and FindOptions.
      Document expected behavior for each query. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase B — Package Replacement
  # =========================================================
  - id: replace-search-packages
    description: Replace Find packages with Graph packages
    instructions: >
      Remove packages:
        - EPiServer.Find
        - EPiServer.Find.Cms
        - EPiServer.Find.Framework
        - Wangkanai.Detection (if present)
      Add:
        - Optimizely.Graph.Cms.Query 13.0.2
        - Optimizely.Graph.AspNetCore 13.0.2
      Restore packages and expect build errors due to
      Find API usage that will be migrated next. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase C — REQUIRED Startup & Middleware Registration
  # =========================================================
  - id: register-graph-services
    description: Register required Optimizely Graph services
    instructions: >
      Update Startup.cs (or Program.cs) to:
      - Remove:
          services.AddFind()
          services.AddDetection()
          app.UseDetection()
      - Add:
          services.AddContentGraph();
          services.AddGraphContentClient();
          services.AddVisitorGroupsCore();
      - Add middleware:
          app.UseGraphTrackingScripts();

      These registrations are mandatory and must be explicit. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase D — Configuration (STRICT & CANONICAL)
  # =========================================================
  - id: configure-graph
    description: Apply canonical Optimizely Graph configuration
    instructions: >
      Remove EPiServer:Find configuration.
      Add EXACTLY the following structure to appsettings.json:

      "Optimizely": {
        "Graph": {
          "GatewayAddress": "https://cg.optimizely.com",
          "AppKey": "YOUR-APP-KEY",
          "Secret": "YOUR-SECRET",
          "SingleKey": "YOUR-SINGLEKEY"
        }
      }

      Values must come from the Graph Management Portal.
      Do not add undocumented keys. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase E — Namespace & Interface Migration
  # =========================================================
  - id: migrate-namespaces
    description: Replace Search & Navigation namespaces
    instructions: >
      Replace:
        EPiServer.Find.* → Optimizely.Graph.Cms.Query
      Remove unused namespaces such as:
        EPiServer.Find.Framework.*
        EPiServer.Find.Helpers.*
        EPiServer.Find.UI
      Replace IClient with IGraphContentClient injected via DI. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase F — Query & Code Migration
  # =========================================================
  - id: migrate-search-code
    description: Rewrite Find queries using Graph APIs
    instructions: >
      Apply official API mappings:
        - Search<T>() → QueryContent<T>()
        - For() → SearchFor()
        - Filter() → Where()
        - FilterForVisitor() → WithDisplayFilters()
        - Take() → Limit()
        - GetContentResult() → await GetAsContentAsync()

      Ensure all queries:
        - Use async/await
        - Include .IncludeTotal()
        - Preserve paging, sorting, relevance

      Rewrite controllers and services accordingly. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase G — Razor Views & Tracking
  # =========================================================
  - id: update-views
    description: Update Razor views for Graph tracking
    instructions: >
      Update _ViewImports.cshtml:
        @addTagHelper *, Optimizely.Graph.AspNetCore

      Update layouts to include:
        <graph-tracking-setup />

      Replace search result links with:
        <graph-trackable-link> when click tracking is used. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase H — Cleanup & Validation
  # =========================================================
  - id: cleanup-search
    description: Final cleanup and validation
    instructions: >
      Ensure:
      - No EPiServer.Find references remain
      - Graph services are registered
      - Graph configuration exists
      - Build succeeds

      Verify:
        - Content is synchronized to Graph
        - Queries return results
        - IncludeTotal() works as expected

      Document troubleshooting steps if results are empty. [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)

  # =========================================================
  # Phase I — Documentation
  # =========================================================
  - id: summary
    description: Generate Graph migration report
    instructions: >
      Generate CMS13-Graph-Upgrade.md including:
        - Package changes
        - Startup & middleware changes
        - Config applied
        - Query rewrites
        - Razor updates
        - Manual Graph verification checklist [1](https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13)