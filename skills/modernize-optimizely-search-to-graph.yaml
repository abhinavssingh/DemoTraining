name: modernize-optimizely-search-to-graph
displayName: Migrate Optimizely Search & Navigation to Optimizely Graph
description: >
  Migrates Optimizely Search & Navigation (EPiServer.Find)
  usage to Optimizely Graph for CMS 13, replacing legacy
  Find APIs with the official Optimizely Graph C# SDK,
  enforcing explicit Graph service registration and
  canonical configuration, query rewrites, and UI wiring.

appliesTo:
  languages: [csharp]
  frameworks: [aspnetcore]
  cms: optimizely

sourceGuidance:
  - https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13

guardrails:
  - Do not upgrade CMS packages (handled by CMS upgrade skill)
  - Search must be migrated, not disabled or commented out
  - Preserve query intent, ordering, paging, and filtering
  - All Graph queries must be asynchronous
  - Do not invent undocumented configuration keys
  - Do not hide Graph registrations behind extension methods
  - Do not create custom Graph abstraction services

tasks:

# =========================================================
# Phase A — Search Usage Analysis (READ‑ONLY)
# =========================================================
- id: analyze-search
  description: Locate Optimizely Search & Navigation (Find) usage
  breakingChange:
    summary: Optimizely Search & Navigation is deprecated and removed in CMS 13.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Migration overview
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#migration-overview
  instructions: >
    Scan the solution for EPiServer.Find usage including:
      IClient, Search<T>(), For(), Filter(), FilterForVisitor(),
      Take(), GetContentResult(), UnifiedSearch, and FindOptions.
    Document expected behavior for each query to preserve intent.

# =========================================================
# Phase B — Package Replacement
# =========================================================
- id: replace-search-packages
  description: Replace EPiServer.Find packages with Optimizely Graph packages
  breakingChange:
    summary: Search & Navigation packages are removed and replaced by Optimizely Graph.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Replace Find NuGet packages
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#replace-find-nuget-packages
  instructions: >
    Remove packages:
      - EPiServer.Find
      - EPiServer.Find.Cms
      - EPiServer.Find.Framework
      - Wangkanai.Detection (if present)

    Add:
      - Optimizely.Graph.Client 1.5.0
      - Optimizely.Graph.Cms 13.0.2
      - Optimizely.Graph.Cms.Query 13.0.2
      - Optimizely.Graph.AspNetCore 13.0.2
      - EPiServer.Cms.UI.ContentManager 13.0.2 (if not already present)

    Restore packages; expect compile errors until query migration completes.

# =========================================================
# Phase C — REQUIRED Graph Service Registration
# (HARD ENFORCEMENT — NO CUSTOM GRAPH SERVICES)
# =========================================================
- id: register-graph-services
  description: Register Optimizely Graph services explicitly
  breakingChange:
    summary: Graph services must be explicitly registered; Find services are removed.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Update service registration
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#update-service-registration
  instructions: >
    Remove legacy Search & Navigation registrations:
      - services.AddFind()
      - services.AddDetection()
      - app.UseDetection()

    Add Graph services directly (NO wrappers):
      - services.AddContentGraph()
      - services.AddContentManager()
      - services.AddGraphContentClient()
      - services.AddVisitorGroupsCore()

    Add Graph middleware:
      - app.UseGraphTrackingScripts()

    FORBIDDEN:
      - GraphServiceCollectionExtensions
      - IGraphSearchService / GraphSearchService
      - Any Graph wrapper or adapter services

    Controllers and services MUST inject:
      Optimizely.Graph.Cms.Query.IGraphContentClient

    FAIL if Graph services are not registered exactly as above.

# =========================================================
# Phase D — Graph Configuration
# =========================================================
- id: configure-graph
  description: Replace Find configuration with canonical Graph configuration
  breakingChange:
    summary: EPiServer:Find configuration is replaced by Optimizely:Graph.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Update configuration
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#update-configuration
  instructions: >
    Remove EPiServer:Find configuration.

    Add EXACT configuration:
      "Optimizely": {
        "Graph": {
          "GatewayAddress": "https://cg.optimizely.com",
          "AppKey": "YOUR-APP-KEY",
          "Secret": "YOUR-SECRET",
          "SingleKey": "YOUR-SINGLEKEY"
        }
      }

    Do not add undocumented keys.

# =========================================================
# Phase E — Namespace & Client Migration
# =========================================================
- id: migrate-namespaces
  description: Replace Find namespaces and IClient usage
  breakingChange:
    summary: IClient and Find namespaces are replaced by IGraphContentClient.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Replace namespaces and client usage
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#replace-namespaces
  instructions: >
    Replace EPiServer.Find.* with Optimizely.Graph.Cms.Query.
    Remove Find helper and UI namespaces.
    Replace IClient injection with IGraphContentClient.

# =========================================================
# Phase F — Query & Code Migration
# =========================================================
- id: migrate-search-code
  description: Rewrite Find queries using Graph QueryContent APIs
  breakingChange:
    summary: Find search APIs are replaced by async Graph SDK QueryContent APIs.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Rewrite search queries
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#rewrite-search-queries
  instructions: >
    Apply official API mappings:
      - Search<T>() → QueryContent<T>()
      - For() → SearchFor()
      - Filter() → Where()
      - FilterForVisitor() → WithDisplayFilters()
      - Take() → Limit()
      - GetContentResult() → await GetAsContentAsync()

    Enforce async/await and IncludeTotal().
    Preserve paging, sorting, and relevance behavior.

# =========================================================
# Phase G — Razor Views & Tracking
# =========================================================
- id: update-views
  description: Update Razor views to use Graph TagHelpers
  breakingChange:
    summary: Graph introduces TagHelpers for tracking and analytics.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Update Razor views
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#update-razor-views
  instructions: >
    Add to _ViewImports.cshtml:
      @addTagHelper *, Optimizely.Graph.AspNetCore

    Add to layouts:
      <graph-tracking-setup />

    Replace search links with <graph-trackable-link>.

# =========================================================
# Phase H — Cleanup & Validation (Operational)
# =========================================================
- id: cleanup-search
  description: Remove remaining Find artifacts and validate Graph migration
  instructions: >
    Ensure:
      - No EPiServer.Find references remain
      - Graph services are registered
      - Graph configuration exists
      - Build succeeds

    Verify queries return results and IncludeTotal() works.

# =========================================================
# Phase I — Documentation
# =========================================================
- id: generate-cms13-graph-upgrade-summary
  description: Generate Graph migration audit documentation
  breakingChange:
    summary: Graph migration must be documented for validation and deployment.
    appliesTo: CMS 12 → CMS 13
    reference:
      title: Build and test
      url: https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/migrate-alloy-12-to-13#build-and-test
  instructions: >
    Generate CMS13-Graph-Upgrade.md documenting package changes,
    registrations, configuration, query rewrites, and UI updates.