name: modernize-optimizely-cms12-to-cms13
displayName: Comprehensive Optimizely CMS 12 → CMS 13 Upgrade
description: >
  Performs a complete and auditable upgrade of an Optimizely CMS 12
  solution to CMS 13 by upgrading the platform runtime, aligning
  CMS packages and service registration, resolving API breaking
  changes, and validating the CMS 13 application and admin experience.

appliesTo:
  languages: [csharp]
  frameworks: [aspnetcore]
  cms: optimizely

sourceGuidance:
  - https://docs.developers.optimizely.com/content-management-system/v13.0.0-CMS/docs/upgrade-to-cms-13

guardrails:
  - Do not migrate search functionality (handled by Graph skill)
  - Do not refactor business/domain logic
  - Resolve obsolete APIs before upgrading CMS packages
  - CMS upgrade must succeed before search migration
  - Every referenced package must be explicitly registered
  - Stop immediately on platform, restore, or build failure

tasks:

  # =========================================================
  # Phase A — Repository Audit & Preparation (READ‑ONLY)
  # =========================================================
  - analyze-repository-structure
  - analyze-optimizely-footprint
  - analyze-service-registration-patterns
  - analyze-obsolete-warnings
  - analyze-third-party-package-compatibility
  - identify-removed-features:
      includes:
        - DynamicProperties
        - Mirroring
        - Legacy PlugIns

  # =========================================================
  # Phase B — Preconditions & Blocking Validation
  # =========================================================
  - validate-current-target-framework
  - validate-dotnet10-sdk-installed
  - validate-database-backup-exists
  - validate-no-unfixed-obsolete-apis
  - validate-cms13-prerequisites

  # =========================================================
  # Phase C — Platform Runtime Upgrade (MANDATORY)
  # =========================================================
  - upgrade-target-framework-to-net10
  - update-global-json-if-present
  - update-docker-images-if-present
  - validate-build-after-platform-upgrade
  - generate-platform-upgrade-report

  # =========================================================
  # Phase D — CMS Package Upgrade
  # =========================================================
  - inventory-nuget-packages
  - upgrade-episerver-and-optimizely-packages-to-13
  - align-package-versions
  - remove-incompatible-third-party-packages
  - validate-dotnet-restore-success

  # =========================================================
  # Phase E — CMS 13 Package & Service Registration
  # (VALIDATE → ENFORCE → VERIFY)
  # =========================================================
  - validate-required-cms13-packages
  - validate-episerver-dependencyinjection-namespace

  - validate-addcms-or-granular-registration
  - enforce-addcms-or-full-granular-parity

  - validate-removed-core-package-registrations
  - enforce-removed-core-package-registrations

  - validate-assembly-scanning-completeness
  - enforce-assembly-scanning-failure-on-missing-add

  - validate-database-compatibility-level
  - enforce-database-compatibility-autoupgrade

  - validate-service-registration-build

  # =========================================================
  # Phase F — CMS 13 API Breaking Changes
  # =========================================================
  - replace-sitedefinition-with-application-model
  - replace-start-page-resolution
  - replace-pagereference-with-contentreference
  - replace-filtereditems-with-items
  - replace-initializationengine-assemblies
  - remove-service-locator-usage
  - update-initializable-modules
  - update-content-type-repository-usage
  - migrate-platform-htmlhelpers-to-taghelpers

  # =========================================================
  # Phase G — Application Model Verification
  # =========================================================
  - validate-application-created-from-site
  - validate-start-page-resolution
  - document-application-model

  # =========================================================
  # Phase H — Admin & UI Validation
  # =========================================================
  - validate-admin-url-changes
  - validate-editor-ui-loads
  - validate-content-creation-and-publishing

  # =========================================================
  # Phase I — Build & Runtime Stabilization
  # =========================================================
  - resolve-build-errors
  - suppress-non-blocking-obsoletes-only
  - run-cms-startup-validation

  # =========================================================
  # Phase J — Documentation & Audit Artifacts
  # =========================================================
  - generate-cms13-upgrade-summary
  - generate-breaking-changes-checklist
  - generate-post-upgrade-validation-guide